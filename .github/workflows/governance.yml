name: BNS-022 neutral governance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "governance/**"
      - "tools/validate_governance.py"
      - "spec/BNS-022-scientific-semantics-neutral-governance.md"
      - "spec/registry.yaml"
      - ".github/workflows/governance.yml"
  push:
    branches: [main]
    paths:
      - "governance/**"
      - "tools/validate_governance.py"
      - "spec/BNS-022-scientific-semantics-neutral-governance.md"
      - "spec/registry.yaml"
      - ".github/workflows/governance.yml"

permissions:
  contents: read

jobs:
  governance-firewall:
    name: Validate governance registries & fail-closed status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install "jsonschema>=4.17,<6"
      - name: Validate neutral-governance records
        run: python tools/validate_governance.py
