name: BNS-019 contract portability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "standards/scientific-semantic-conventions/**"
      - "schemas/**"
      - "tools/validate_schemas.py"
      - "tools/validate_conformance.py"
      - ".github/workflows/interoperability.yml"
  push:
    branches: [main]
    paths:
      - "standards/scientific-semantic-conventions/**"
      - "schemas/**"
      - "tools/validate_schemas.py"
      - "tools/validate_conformance.py"
      - ".github/workflows/interoperability.yml"

permissions:
  contents: read

jobs:
  language-neutral-contract:
    name: Validate released schemas, fixtures & CTS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install "pyyaml>=6,<7" "jsonschema>=4.17,<6"
      - name: Validate schemas and released artifacts
        run: python tools/validate_schemas.py
      - name: Validate Conformance Test Suite and badge policy
        run: python tools/validate_conformance.py
